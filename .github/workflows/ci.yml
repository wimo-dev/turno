name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        # Every Node line that is LTS (active or maintenance) at release time.
        node: [22, 24, 26]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read # check out the code
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        if: runner.os == 'Linux'
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check
        env:
          # The end-to-end test needs a signed-in claude; CI skips it.
          TURNO_SKIP_E2E: "1"
      - run: node scripts/pack-check.mjs

  windows:
    # turno-browser and the turno-core parts it uses on Windows. turno-cli (mcpd, launchd) is
    # not supported there, so only these two packages build and test here.
    name: browser on windows (node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    runs-on: windows-latest
    permissions:
      contents: read # check out the code
    env:
      # The package scripts (rm -rf, chmod) are POSIX; pnpm runs them with Git Bash here.
      npm_config_script_shell: C:\Program Files\Git\bin\bash.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter turno-core --filter turno-browser run build
      - run: pnpm --filter turno-core --filter turno-browser run typecheck
      # The secret store tests drive POSIX shell stand-ins for security and secret-tool; the
      # Windows secret store comes with its own tests.
      - run: pnpm --filter turno-core exec vitest run --exclude test/secrets.test.ts
      - name: Time the process table (diagnostic)
        shell: pwsh
        run: |
          foreach ($i in 1..3) { (Measure-Command { powershell.exe -NoProfile -NonInteractive -Command "Get-CimInstance Win32_Process | Out-Null" }).TotalSeconds }
      - run: pnpm --filter turno-browser exec vitest run --reporter=verbose
        if: ${{ !cancelled() }}
      # What a person gets from npm: the packed packages installed with npm (its .cmd shims),
      # then install-browser and a smoke launch of Chrome through doctor, in a scratch turno folder.
      - name: Install the packed packages with npm and run them
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pack = Join-Path $env:RUNNER_TEMP "pack"
          $app = Join-Path $env:RUNNER_TEMP "app"
          New-Item -ItemType Directory -Force $pack, $app | Out-Null
          foreach ($pkg in "core", "browser") {
            Push-Location "packages/$pkg"; pnpm pack --pack-destination $pack; Pop-Location
            if ($LASTEXITCODE) { exit 1 }
          }
          $core = (Get-ChildItem $pack -Filter "turno-core-*.tgz").FullName
          $browser = (Get-ChildItem $pack -Filter "turno-browser-*.tgz").FullName
          @{ private = $true; dependencies = @{ "turno-browser" = "file:$browser" }; overrides = @{ "turno-core" = "file:$core" } } |
            ConvertTo-Json | Set-Content (Join-Path $app "package.json")
          Set-Location $app
          npm install --no-audit --no-fund
          if ($LASTEXITCODE) { exit 1 }
          $env:TURNO_CONFIG_DIR = Join-Path $env:RUNNER_TEMP "turno\config"
          $env:TURNO_STATE_DIR = Join-Path $env:RUNNER_TEMP "turno\state"
          $env:TURNO_DATA_DIR = Join-Path $env:RUNNER_TEMP "turno\data"
          $env:Path = "$app\node_modules\.bin;$env:Path"
          cmd /c "turno-browser --version"
          if ($LASTEXITCODE) { exit 1 }
          cmd /c "turno-browser add smoke"
          if ($LASTEXITCODE) { exit 1 }
          cmd /c "turno-browser setup claude-code --identity smoke"
          # Chrome for Testing goes to %LOCALAPPDATA%\ms-playwright: no admin rights needed.
          cmd /c "turno-browser install-browser"
          if ($LASTEXITCODE) { exit 1 }
          $doctor = cmd /c "turno-browser doctor --json" | Out-String
          Write-Output $doctor
          $checks = $doctor | ConvertFrom-Json
          $checks = $checks.checks
          if (-not ($checks | Where-Object { $_.status -eq "ok" -and $_.text -like "smoke launch:*" })) {
            Write-Error "doctor did not start and close Chrome"
          }
          if (-not ($checks | Where-Object { $_.status -eq "ok" -and $_.text -like "Chrome for Testing *" })) {
            Write-Error "doctor did not find the Chrome for Testing install-browser downloaded"
          }
          cmd /c "turno-browser remove smoke --yes"
          if ($LASTEXITCODE) { exit 1 }

  pull-request:
    name: pull request rules
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the code and diff it against the base
      pull-requests: read # dependency review reads the pull request
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Title follows Conventional Commits
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/commit-msg.mjs --title "$TITLE"
      - name: Source changes carry a changeset
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-changeset') }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE"...HEAD)
          if echo "$changed" | grep -q '^packages/[^/]*/src/' && ! echo "$changed" | grep -q '^\.changeset/.*\.md$'; then
            echo "::error::This pull request changes packages/*/src but adds no changeset. Run pnpm changeset, or label it no-changeset if users will not notice."
            exit 1
          fi
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, SSPL-1.0

  windows-secrets:
    # The Windows secret store (DPAPI through Windows PowerShell) with a real round trip in a
    # temporary folder. Only these tests run here; the rest of the suite is not ported to Windows.
    name: secret store on windows
    runs-on: windows-latest
    permissions:
      contents: read # check out the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter turno-core exec vitest run test/secrets.test.ts --reporter verbose
