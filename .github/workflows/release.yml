name: release

# Three jobs, so the one that can publish never runs project code (the lesson of the
# 2026-05 Mini Shai-Hulud attack):
#   version  with pending changesets, opens or updates the "Version packages" pull request.
#   build    after that pull request is merged: checks, packs every unpublished package
#            (prepack writes its npm-shrinkwrap.json; pack:check verifies it and that nothing
#            in the published tree has an install script), writes an SBOM per package,
#            uploads them as an artifact. No id-token, no secrets.
#   Every job runs Harden-Runner in block mode with its own allow list.
#   publish  downloads the tarballs, attests them and publishes with npm trusted publishing.
#            No checkout, no install, no cache, runs in the protected "npm" environment,
#            with Harden-Runner blocking every host outside its allow list (as in tag).
#            Trusted publishing stages each version; a maintainer approves it on npmjs.com.
#   tag      creates the git tags and GitHub releases of what was published.
#   standalone  after a turno-browser release, the standalone executables (standalone.yml),
#            built from the tarball that was published and uploaded to its GitHub release. It
#            runs after npm has the version, so a failure here never holds back the npm release.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: version pull request
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the version commit to the changeset-release branch
      pull-requests: write # open or update the version pull request
    outputs:
      has-changesets: ${{ steps.changesets.outputs.has-changesets }}
    steps:
      # Block mode: checkout and the changesets push (github.com), the version pull
      # request (api.github.com), pnpm and the lockfile refresh (registry.npmjs.org), from the
      # Harden-Runner audit of release runs. The rest are where pnpm/action-setup and
      # setup-node download a tool that is not in the runner's cache.
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            registry.npmjs.org:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            nodejs.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm version-packages
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          create-github-releases: false
          push-git-tags: false

  build:
    name: check and pack
    needs: version
    if: needs.version.outputs.has-changesets == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the code
    outputs:
      count: ${{ steps.plan.outputs.count }}
    steps:
      # Block mode: checkout (github.com), pnpm, the install and release-plan's
      # `npm view` (registry.npmjs.org), and tool downloads as in the version job. Tests use only
      # 127.0.0.1; a real Chrome's own calls to Google are blocked, which the tests do not need.
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            registry.npmjs.org:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            nodejs.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      # turno-core resolves through its dist/ exports, so the packages are built before the
      # type check, as in ci.yml.
      - run: pnpm build
      - run: pnpm check
        env:
          TURNO_SKIP_E2E: "1"
      - run: pnpm pack:check
      - id: plan
        run: node scripts/release-plan.mjs release
      - if: steps.plan.outputs.count != '0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish to npm
    needs: build
    if: needs.build.outputs.count != '0'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write # npm trusted publishing and provenance
      attestations: write # build provenance attestation of the tarballs
      contents: read # read the artifact
    steps:
      # Block mode: only the hosts this job uses (from the Harden-Runner log of the 0.1.1
      # release). Harden-Runner itself allows the Actions service hosts
      # (*.actions.githubusercontent.com, the artifact blob storage).
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            registry.npmjs.org:443
            api.github.com:443
            github.com:443
            uploads.github.com:443
            token.actions.githubusercontent.com:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            raw.githubusercontent.com:443
            nodejs.org:443
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.tgz
      # plan.json lists each package after the workspace packages it depends on (turno-core
      # first), and the step stops at the first failure. A package published for the
      # first time needs its trusted publisher set up by hand first (RELEASING.md, "A new package").
      - name: Publish the tarballs (dependencies first)
        working-directory: release
        run: |
          for row in $(jq -c '.[]' plan.json); do
            tarball=$(jq -r .tarball <<<"$row")
            tag=$(jq -r .tag <<<"$row")
            npm publish "$tarball" --provenance --access public --tag "$tag"
          done

  tag:
    name: git tags and releases
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create tags and releases
    outputs:
      browser-version: ${{ steps.tag.outputs.browser-version }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            uploads.github.com:443
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Tag and release what was published
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        working-directory: release
        run: |
          for row in $(jq -c '.[]' plan.json); do
            name=$(jq -r .name <<<"$row")
            version=$(jq -r .version <<<"$row")
            tag=$(jq -r .tag <<<"$row")
            flags=()
            if [ "$tag" != latest ]; then flags+=(--prerelease); fi
            gh api "repos/$REPO/git/refs" -f "ref=refs/tags/$name@$version" -f "sha=$SHA"
            gh release create "$name@$version" --repo "$REPO" --verify-tag "${flags[@]}" \
              --title "$name $version" --notes-file "${name}-${version}.notes.md" "${name}-${version}.cdx.json"
            if [ "$name" = turno-browser ]; then echo "browser-version=$version" >> "$GITHUB_OUTPUT"; fi
          done

  standalone:
    name: standalone executables
    needs: tag
    if: needs.tag.outputs.browser-version != ''
    permissions:
      contents: write # upload the archives to the turno-browser release
      id-token: write # sign their attestations
      attestations: write # store their attestations
    # A local reusable workflow already comes from the commit of this run; the newer "$/" form
    # means the same and is not yet understood by every workflow linter.
    uses: ./.github/workflows/standalone.yml # zizmor: ignore[self-repository]
    with:
      version: ${{ needs.tag.outputs.browser-version }}
      release-artifact: release
