name: standalone

# The standalone turno-browser executables: one file per platform for machines without Node or
# npm (scripts/standalone-build.mjs). Three jobs, so the one that can write never runs project code:
#   build    on macOS (the macOS executables are signed ad hoc there), every target from the
#            same packed package and the pinned Node.js; uploads the archives and SHA256SUMS
#            as an artifact. No id-token, no secrets.
#   smoke    on each platform: the executable answers --version and an MCP initialize
#            (scripts/standalone-smoke.mjs). Windows is experimental and may fail.
#   release  attests the archives and uploads them with SHA256SUMS to the GitHub release
#            turno-browser@<version>. Skipped in a dry run, which keeps them in the run's artifact.
# Signing: the macOS executables are signed ad hoc and the Windows one is not signed, so
# Gatekeeper and SmartScreen warn on a browser download (the docs say what to do). Developer ID
# signing and notarization, or Authenticode, would sign each executable in the build job before
# it is zipped, with the certificates as secrets; there are none yet.
# Callers: release.yml after it publishes turno-browser (with the tarball it published); a
# maintainer, for a version already on npm (workflow_dispatch); a pull request that changes the
# build, as a dry run from the checkout.
on:
  workflow_call:
    inputs:
      version:
        description: turno-browser version
        required: true
        type: string
      release-artifact:
        description: artifact of the calling run with the packed tarballs (built from them, not from npm)
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      version:
        description: turno-browser version on npm with a GitHub release (turno-browser@<version>)
        required: true
        type: string
      dry-run:
        description: keep the archives in this run's artifacts instead of uploading them to the release
        required: false
        type: boolean
        default: true
  pull_request:
    paths:
      - .github/workflows/standalone.yml
      - scripts/standalone-*
      - scripts/local-registry.mjs

permissions: {}

concurrency:
  group: standalone-${{ github.event_name }}-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read # check out the code
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pin
        name: Pinned Node.js release (a SEA blob only loads in the release that wrote it)
        run: echo "node=$(jq -r .version scripts/standalone-node.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.pin.outputs.node }}
      - id: version
        name: Version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$VERSION" ]; then VERSION=$(jq -r .version packages/browser/package.json); fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      # A pull request: the packages of this checkout, packed as a release packs them.
      - if: github.event_name == 'pull_request'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: github.event_name == 'pull_request'
        name: Pack turno-core and turno-browser from the checkout
        run: |
          pnpm install --frozen-lockfile
          mkdir -p "$RUNNER_TEMP/tarballs"
          for dir in core browser; do (cd "packages/$dir" && pnpm pack --pack-destination "$RUNNER_TEMP/tarballs"); done
      # The release: the tarballs it published.
      - if: inputs.release-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.release-artifact }}
          path: ${{ runner.temp }}/tarballs
      - name: Build the executables
        env:
          FROM: ${{ (github.event_name == 'pull_request' || inputs.release-artifact != '') && format('{0}/tarballs', runner.temp) || inputs.version }}
        run: node scripts/standalone-build.mjs --from "$FROM" --out standalone
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: standalone
          path: standalone/
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: smoke (${{ matrix.target }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, os: macos-15 }
          - { target: darwin-x64, os: macos-15-intel }
          - { target: linux-x64, os: ubuntu-latest }
          # Experimental until turno-browser supports Windows.
          - { target: win-x64, os: windows-latest, experimental: true }
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    timeout-minutes: 15
    permissions:
      contents: read # check out the smoke script
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        if: runner.os == 'Linux'
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            nodejs.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/standalone-smoke.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: standalone
          path: standalone
      - name: Check the archive against SHA256SUMS and unpack it
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cd standalone
          grep " turno-browser-$TARGET.zip\$" SHA256SUMS > one.sum
          if command -v sha256sum >/dev/null; then sha256sum -c one.sum; else shasum -a 256 -c one.sum; fi
          mkdir unpacked
          if [ "$RUNNER_OS" = Windows ]; then 7z x -bd -ounpacked "turno-browser-$TARGET.zip"; else unzip -q -d unpacked "turno-browser-$TARGET.zip"; fi
          ls -l unpacked
      - name: --version and an MCP initialize
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          exe=standalone/unpacked/turno-browser
          if [ "$RUNNER_OS" = Windows ]; then exe="$exe.exe"; fi
          node scripts/standalone-smoke.mjs "$exe" "$VERSION"

  release:
    name: upload to the release
    needs: [build, smoke]
    if: github.event_name != 'pull_request' && !inputs.dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # upload the archives to the release
      id-token: write # sign the attestations
      attestations: write # store the attestations
    steps:
      # Block mode: the release upload (api.github.com, uploads.github.com) and the attestation
      # signing (token.actions.githubusercontent.com and Sigstore), as in release.yml's publish job.
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            uploads.github.com:443
            token.actions.githubusercontent.com:443
            fulcio.sigstore.dev:443
            rekor.sigstore.dev:443
            tuf-repo-cdn.sigstore.dev:443
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: standalone
          path: standalone
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: standalone/*.zip
      - name: Upload to turno-browser@${{ needs.build.outputs.version }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        working-directory: standalone
        run: gh release upload "turno-browser@$VERSION" turno-browser-*.zip SHA256SUMS --repo "$REPO" --clobber
